name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: project/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../live_tests && ruff format --check . ../live_tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL, incl. legacy migration)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate

  live:
    # The production stack (nginx + gunicorn + PostgreSQL + Redis), tested over HTTP and in a real browser.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SECRET_KEY: ci-only-secret-key-ci-only-secret-key-0000
      POSTGRES_PASSWORD: ci-only
      HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r live_tests/requirements.txt && playwright install --with-deps chromium
      - run: pytest live_tests
        env:
          BASE_URL: http://127.0.0.1:8080
          CODE_LOG_COMMAND: docker compose logs --no-log-prefix backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-screenshots
          path: live-test-screenshots
      - if: failure()
        run: docker compose logs
